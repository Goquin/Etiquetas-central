<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Con esto enlazo la hoja de estilos -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- FUENTE ROBOTO -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    
    <title>Etiqueta Central</title>
</head>
<body>
    <section class="changes">
        <header class="changes__header">
            
            <!-- Icono -->
            
            <div class="changes__icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="3.5" width="20" height="20" rx="3"/>
                <path d="M12 7.5v5M9.5 10h5M9.5 15.5h5"/>
                </svg>
             </div>

            <!-- Parte central -->

            <div class="changes__sumary">

                <h1 class="changes__title">Se han editado tres archivos</h1>

                <p class="diff"><span class="diff__add">+87</span> <span class="diff__del">-77</span></p>

            </div>

            <!-- Acciones -->

            <div class="changes__actions">
                <button type="button" class="btn btn--ghost">Desacer <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
                <button type="button" class="btn btn--outline">Ver cambios</button>
            </div>

        </header>
    </section>
</body>
</html>
